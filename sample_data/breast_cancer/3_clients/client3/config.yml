fc-rand-forest:
  input:
    train: 'train.csv'
    test: 'test.csv'
  output:
    pred: 'pred.csv'
    test: 'test.csv'
  format:
    sep: ','
    label_col: 'target'
  split:
    mode: 'file'
    dir: .
  n_estimators: 100
  max_depth: 10
  min_samples_split: 10
  max_features: 'sqrt'
  max_samples: 0.75
  bootstrap: True
  random_state: 42
  mode: 'classification'
  n_bins: 25
  use_weighted_classes: True
  output_mode: 'model+pred'
